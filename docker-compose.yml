# Development-only PostgreSQL. Credentials come from the root .env file
# (copy .env.example to .env first). postgres:17-alpine is a multi-arch image,
# so it runs natively on Apple Silicon (ARM64) without emulation.
services:
  postgres:
    image: postgres:17-alpine
    container_name: stayease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only so the dev database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - stayease_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  stayease_postgres_data:
